{% extends "base.html" %}{% block content %}
<h1>Состояние сборщика</h1><div id="stats" class="cards">Загрузка…</div><h2>Последние ошибки</h2><pre id="errors">Загрузка…</pre>
<script>Promise.all([fetch('/api/stats').then(r=>r.json()),fetch('/api/collector/status').then(r=>r.json())]).then(([s,c])=>{stats.innerHTML=Object.entries(s).map(([k,v])=>`<article><small>${k}</small><strong>${v??'—'}</strong></article>`).join('');errors.textContent=JSON.stringify(c.errors,null,2)||'Нет ошибок';});</script>
{% endblock %}
