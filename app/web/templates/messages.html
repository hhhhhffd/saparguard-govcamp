{% extends "base.html" %}{% block content %}
<h1>Сообщения</h1><p id="status">Загрузка…</p><table><thead><tr><th>Дата</th><th>Чат</th><th>Отправитель</th><th>Текст</th><th>Медиа</th><th>ID</th><th>Статус</th></tr></thead><tbody id="messages"></tbody></table><div id="sentinel" class="loading">Загрузка…</div><dialog id="detail"><button onclick="detail.close()">Закрыть</button><section id="media"></section><pre id="raw"></pre></dialog>
<script>
const displayTimeZone={{ display_timezone|tojson }}, seen=new Set(), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let cursor=null,loading=false,hasMore=true;
function formatDate(value){if(!value)return '—';const parts=new Intl.DateTimeFormat('ru-RU',{timeZone:displayTimeZone,hour:'2-digit',minute:'2-digit',second:'2-digit',day:'2-digit',month:'2-digit',year:'numeric',hour12:false}).formatToParts(new Date(value)).reduce((a,p)=>(a[p.type]=p.value,a),{});return `${parts.hour}.${parts.minute}.${parts.second} ${parts.day}.${parts.month}.${parts.year}`}
async function load(){if(loading||!hasMore)return;loading=true;status.textContent='Загрузка…';const params=new URLSearchParams({limit:'50'});if(cursor){params.set('cursor_sent_at',cursor.sent_at);params.set('cursor_id',cursor.id)}try{const data=await fetch('/api/messages?'+params).then(r=>{if(!r.ok)throw new Error('Не удалось загрузить сообщения');return r.json()});for(const m of data.items){if(seen.has(m.id))continue;seen.add(m.id);messages.insertAdjacentHTML('beforeend',`<tr onclick="showMessage(${m.id})"><td>${formatDate(m.published_at)}</td><td>${esc(m.chat.title||m.telegram_chat_id)}</td><td>${esc(m.sender?.username||m.sender?.first_name)}</td><td>${esc((m.text||'').slice(0,160))}</td><td>${esc(m.media_type)}</td><td>${m.telegram_message_id}</td><td>${m.is_deleted?'удалено':m.edited_at?'изменено':'—'}</td></tr>`)}cursor=data.next_cursor;hasMore=data.has_more;status.textContent=hasMore?'':'Сообщения закончились';sentinel.textContent=hasMore?'Прокрутите ниже, чтобы загрузить ещё':'Все сообщения загружены'}catch(error){status.textContent=error.message}finally{loading=false}}
async function showMessage(id){const data=await fetch('/api/messages/'+id).then(r=>r.json());media.innerHTML=(data.media_files||[]).map(file=>`<article><img src="/api/media/${file.id}" alt="Фото сообщения"><p>Статус: ${esc(file.processing_status)}</p>${file.last_error?`<p>Ошибка: ${esc(file.last_error)}</p>`:''}<p>${file.plates.map(p=>`${esc(p.normalized_text)} (${p.confidence==null?'—':Math.round(p.confidence*100)+'%'})`).join('<br>')||'Номера не найдены'}</p></article>`).join('');raw.textContent=JSON.stringify(data,null,2);detail.showModal()}
new IntersectionObserver(entries=>{if(entries.some(entry=>entry.isIntersecting))load()},{rootMargin:'300px'}).observe(sentinel);load();
</script>{% endblock %}
