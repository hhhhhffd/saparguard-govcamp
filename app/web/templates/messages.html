{% extends "base.html" %}{% block content %}
<h1>Сообщения</h1><form id="filters"><input name="query" placeholder="Поиск текста"><input name="chat_id" placeholder="ID чата"><input name="sender_id" placeholder="ID отправителя"><label><input type="checkbox" name="has_media"> Только медиа</label><button>Найти</button></form><p id="total"></p><table><thead><tr><th>Дата</th><th>Чат</th><th>Отправитель</th><th>Текст</th><th>Медиа</th><th>ID</th><th>Статус</th></tr></thead><tbody id="messages"></tbody></table><button id="more">Следующая страница</button><dialog id="detail"><button onclick="detail.close()">Закрыть</button><pre></pre></dialog>
<script>
let page=1;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(reset=false){if(reset){page=1;messages.innerHTML=''}const f=new FormData(filters),p=new URLSearchParams({page});if(f.get('query'))p.set('query',f.get('query'));if(f.get('chat_id'))p.set('chat_id',f.get('chat_id'));if(f.get('sender_id'))p.set('sender_id',f.get('sender_id'));if(f.get('has_media'))p.set('has_media','true');const d=await fetch('/api/messages?'+p).then(r=>r.json());total.textContent=`Всего: ${d.total}`;messages.insertAdjacentHTML('beforeend',d.items.map(m=>`<tr onclick="showMessage(${m.id})"><td>${esc(m.published_at)}</td><td>${esc(m.chat.title||m.telegram_chat_id)}</td><td>${esc(m.sender?.username||m.sender?.first_name)}</td><td>${esc((m.text||'').slice(0,160))}</td><td>${esc(m.media_type)}</td><td>${m.telegram_message_id}</td><td>${m.is_deleted?'удалено':m.edited_at?'изменено':'—'}</td></tr>`).join(''));more.disabled=d.items.length===0}
async function showMessage(id){const d=await fetch('/api/messages/'+id).then(r=>r.json());detail.querySelector('pre').textContent=JSON.stringify(d,null,2);detail.showModal()}filters.onsubmit=e=>{e.preventDefault();load(true)};more.onclick=()=>{page++;load()};load(true);
</script>{% endblock %}
