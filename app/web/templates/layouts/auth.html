<!doctype html><html lang="{{ request.state.locale }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SaparGuard</title><link rel="stylesheet" href="/static/css/app.css"></head><body><main class="auth-page"><form method="post" action="/ui/actions/locale" class="locale-switch auth-locale-switch" aria-label="{{ t('language.switcher') }}"><input type="hidden" name="next_url" value="{{ request.url.path }}{% if request.url.query %}?{{ request.url.query }}{% endif %}"><button name="locale" value="kk" class="{% if request.state.locale == 'kk' %}selected{% endif %}">{{ t('language.kz') }}</button><button name="locale" value="ru" class="{% if request.state.locale == 'ru' %}selected{% endif %}">{{ t('language.ru') }}</button></form>{% block content %}{% endblock %}</main></body></html>
