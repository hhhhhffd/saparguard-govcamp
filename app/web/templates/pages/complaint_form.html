{% extends "layouts/base.html" %}{% block content %}<header class="page-header"><div><h1>{{ t('complaints.create') }}</h1></div></header><section class="data-card form-card">{% if error %}<p class="error-banner">{{ error }}</p>{% endif %}<form method="post" class="form-stack"><label>{{ t('complaints.subject') }}<input name="subject" maxlength="200" value="{{ subject|default('') }}" required></label><label>{{ t('complaints.description') }}<textarea name="description" rows="8" required>{{ description|default('') }}</textarea></label><label>{{ t('complaints.location') }}<input name="location_text" maxlength="500" value="{{ location_text|default('') }}"></label><button>{{ t('complaints.submit') }}</button></form></section>{% endblock %}
