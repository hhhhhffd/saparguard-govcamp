{% extends "layouts/base.html" %}{% block content %}<header class="page-header"><div><p class="eyebrow">SaparGuard</p><h1>{{ t('complaints.create') }}</h1><p class="muted">{{ t('complaints.create_hint') }}</p></div></header><section class="data-card form-card complaint-form-card">{% if error %}<p class="error-banner">{{ error }}</p>{% endif %}<form method="post" class="form-stack" data-complaint-form data-description-default="{{ t('complaints.description_placeholder') }}" data-location-prefix="{{ t('complaints.coordinates') }}" data-location-unavailable="{{ t('complaints.location_unavailable') }}"><label>{{ t('complaints.subject') }}<select name="subject" required data-complaint-topic><option value="">{{ t('complaints.subject_placeholder') }}</option>{% for topic in complaint_topics %}<option value="{{ topic }}" data-description-placeholder="{{ t('complaint_topic_description.' ~ topic) }}" {% if subject|default('') == topic %}selected{% endif %}>{{ t('complaint_topic.' ~ topic) }}</option>{% endfor %}</select></label><label class="complaint-description" data-complaint-description {% if not subject|default('') %}hidden{% endif %}>{{ t('complaints.description') }}<textarea name="description" rows="4" required data-complaint-description-input placeholder="{{ t('complaints.description_placeholder') }}">{{ description|default('') }}</textarea></label><div class="complaint-location"><label>{{ t('complaints.location_optional') }}<input name="location_text" maxlength="500" value="{{ location_text|default('') }}" placeholder="{{ t('complaints.location_placeholder') }}" data-complaint-location></label><button class="secondary-button" type="button" data-complaint-geolocation>{{ t('complaints.use_geolocation') }}</button></div><button type="submit">{{ t('complaints.submit') }}</button></form></section>{% endblock %}
