{% extends "layouts/base.html" %}
{% from "components/button.html" import button %}
{% block content %}
<h1 class="text-2xl font-semibold">Сообщения</h1>
<form class="mt-6 grid gap-3 rounded border border-slate-200 bg-white p-4 md:grid-cols-3" method="get" action="/messages" hx-get="/ui/fragments/messages" hx-target="#messages-results" hx-indicator="#messages-loading">
  <input class="rounded border border-slate-300 px-3 py-2" name="query" value="{{ filters.query }}" placeholder="Поиск по тексту">
  <input class="rounded border border-slate-300 px-3 py-2" name="chat_id" value="{{ filters.chat_id }}" placeholder="Telegram chat ID">
  <input class="rounded border border-slate-300 px-3 py-2" name="sender_id" value="{{ filters.sender_id }}" placeholder="Telegram sender ID">
  <input class="rounded border border-slate-300 px-3 py-2" name="date_from" value="{{ filters.date_from }}" placeholder="Дата от (ISO 8601)">
  <input class="rounded border border-slate-300 px-3 py-2" name="date_to" value="{{ filters.date_to }}" placeholder="Дата до (ISO 8601)">
  <select class="rounded border border-slate-300 px-3 py-2" name="message_type"><option value="">Все типы</option>{% for kind in ['driver_offer','passenger_request','parcel_offer','parcel_request','service_message','commercial_spam','conversation','unknown'] %}<option value="{{ kind }}" {% if filters.message_type == kind %}selected{% endif %}>{{ kind }}</option>{% endfor %}</select>
  <input class="rounded border border-slate-300 px-3 py-2" name="entity_query" value="{{ filters.entity_query }}" placeholder="Телефон, город или авто">
  <input type="hidden" name="limit" value="{{ filters.limit }}">
  {{ button('Применить') }}
</form>
<p id="messages-loading" class="htmx-indicator mt-2 text-sm text-slate-500">Загрузка…</p>
<section id="messages-results" class="mt-6">
  {% include "partials/messages_table.html" %}
</section>
<dialog
  id="message-detail-dialog"
  class="m-auto w-11/12 max-w-4xl rounded border border-slate-200 bg-white p-0 shadow-xl backdrop:bg-slate-950/50"
  aria-labelledby="message-detail-title"
>
  <article class="max-h-[85vh] overflow-auto p-6">
    <div class="flex items-center justify-between gap-4">
      <h2 id="message-detail-title" class="text-lg font-semibold">Детали сообщения</h2>
      <form method="dialog">
        <button type="submit" class="rounded border border-slate-300 px-3 py-1 text-sm">Закрыть</button>
      </form>
    </div>
    <div id="message-detail-content" class="mt-4"></div>
  </article>
</dialog>
{% endblock %}
