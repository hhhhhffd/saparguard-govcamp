{% extends "layouts/base.html" %}{% block content %}<header class="page-header"><div><p class="eyebrow">SaparGuard</p><h1>{{ t('messages.title') }}</h1></div></header><form class="filter-bar" method="get" action="/messages" hx-get="/ui/fragments/messages" hx-target="#messages-results" hx-push-url="true"><input name="query" value="{{ filters.query }}" placeholder="{{ t('common.search') }}"><input name="chat_id" value="{{ filters.chat_id }}" placeholder="Source ID"><input name="sender_id" value="{{ filters.sender_id }}" placeholder="Sender ID"><select name="message_type"><option value="">{{ t('messages.type') }}</option>{% for kind in ['driver_offer','passenger_request','parcel_offer','parcel_request','service_message','commercial_spam','conversation','unknown'] %}<option value="{{ kind }}" {% if filters.message_type==kind %}selected{% endif %}>{{ kind }}</option>{% endfor %}</select><input name="entity_query" value="{{ filters.entity_query }}" placeholder="Телефон, маршрут, авто"><input type="hidden" name="limit" value="{{ filters.limit }}"><button>{{ t('common.apply') }}</button></form><p id="messages-loading" class="htmx-indicator muted">{{ t('common.loading') }}</p><section id="messages-results" class="data-card">{% include "partials/messages_table.html" %}</section><dialog id="message-detail-dialog" class="message-drawer"><article><form method="dialog"><button class="drawer-close">×</button></form><div id="message-detail-content"></div></article></dialog>{% endblock %}
