{% extends "layouts/auth.html" %}{% block content %}<section class="auth-card"><a class="brand" href="/auth/login">Sapar<span>Guard</span></a><h1>{{ t('auth.register') }}</h1>{% if error %}<p class="error-banner">{{ error }}</p>{% endif %}<form method="post" action="/auth/register" class="form-stack"><label>Email<input name="email" type="email" autocomplete="email" value="{{ email }}" required></label><label>{{ t('auth.password') }}<input name="password" type="password" autocomplete="new-password" minlength="12" required></label><label>{{ t('auth.password_confirmation') }}<input name="password_confirmation" type="password" autocomplete="new-password" minlength="12" required></label><p class="muted">{{ t('auth.password_hint') }}</p><button type="submit">{{ t('auth.register') }}</button></form><p><a href="/auth/login">{{ t('auth.login') }}</a></p></section>{% endblock %}
