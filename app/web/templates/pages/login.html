{% extends "layouts/auth.html" %}{% block content %}<section class="auth-card"><a class="brand" href="/auth/login">Sapar<span>Guard</span></a><h1>{{ t('auth.login') }}</h1>{% if registered %}<p class="notice">{{ t('auth.registration_complete') }}</p>{% endif %}{% if error %}<p class="error-banner">{{ error }}</p>{% endif %}<form method="post" action="/auth/login" class="form-stack"><label>Email<input name="email" type="email" autocomplete="email" value="{{ email }}" required></label><label>{{ t('auth.password') }}<input name="password" type="password" autocomplete="current-password" minlength="12" required></label><button type="submit">{{ t('auth.sign_in') }}</button></form>{% if google_available %}<div class="google-sign-in" data-google-sign-in data-client-id="{{ google_client_id }}" data-auth-url="/auth/google"><button class="google-button disabled" type="button" disabled aria-disabled="true">😢 {{ t('auth.google_unavailable') }}</button></div><script src="https://accounts.google.com/gsi/client" async defer></script><script src="/static/js/google-sign-in.js" defer></script>{% else %}<button class="google-button disabled" type="button" disabled aria-disabled="true">😢 {{ t('auth.google_unavailable') }}</button>{% endif %}<p><a href="/auth/register">{{ t('auth.create_account') }}</a></p></section>{% endblock %}
