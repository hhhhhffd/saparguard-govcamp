{% extends "layouts/base.html" %}{% block content %}<header class="page-header"><div><h1>{{ t('admin.create_user') }}</h1></div></header><section class="data-card form-card">{% if error %}<p class="error-banner">{{ error }}</p>{% endif %}<form method="post" class="form-stack"><label>Email<input name="email" type="email" value="{{ form.email if form else '' }}" required></label><label>{{ t('auth.password') }}<input name="password" type="password" minlength="12" required></label><label>{{ t('admin.role') }}<select name="role">{% for item in roles %}<option value="{{ item }}" {% if form and form.role == item %}selected{% endif %}>{{ t('role.' ~ item) }}</option>{% endfor %}</select></label><label><input type="checkbox" name="is_active" {% if not form or form.is_active %}checked{% endif %}> {{ t('admin.active') }}</label><button>{{ t('admin.create_user') }}</button></form></section>{% endblock %}
