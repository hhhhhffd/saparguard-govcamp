services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saparguard
      POSTGRES_PASSWORD: saparguard
      POSTGRES_DB: saparguard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saparguard -d saparguard"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  migrate:
    image: ${APP_IMAGE:-tg-channel-parser:local}
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://saparguard:saparguard@postgres:5432/saparguard
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
  api:
    image: ${APP_IMAGE:-tg-channel-parser:local}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://saparguard:saparguard@postgres:5432/saparguard
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - telethon_data:/app/data
      - reviewed_artifacts:/app/evaluation/local-reviewed
    depends_on:
      migrate:
        condition: service_completed_successfully
  collector:
    image: ${APP_IMAGE:-tg-channel-parser:local}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://saparguard:saparguard@postgres:5432/saparguard
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-2}
      OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-1}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-1}
      MALLOC_ARENA_MAX: ${MALLOC_ARENA_MAX:-2}
    command: python -m app.collector.service
    volumes:
      - telethon_data:/app/data
      - alpr_cache:/root/.cache
    depends_on:
      migrate:
        condition: service_completed_successfully
  analysis-worker:
    image: ${APP_IMAGE:-tg-channel-parser:local}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://saparguard:saparguard@postgres:5432/saparguard
    command: python -m app.processing.text.worker
    depends_on:
      migrate:
        condition: service_completed_successfully
  profile-worker:
    image: ${APP_IMAGE:-tg-channel-parser:local}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://saparguard:saparguard@postgres:5432/saparguard
    command: python -m app.processing.profiles.worker
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  telethon_data:
  alpr_cache:
  reviewed_artifacts:
